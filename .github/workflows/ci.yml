name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate notebook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat nbconvert

      - name: Validate notebook structural integrity
        run: |
          python -c "
          import nbformat
          nb = nbformat.read(open('VGG16.ipynb', encoding='utf-8'), as_version=4)
          nbformat.validate(nb)
          print('OK: VGG16.ipynb')
          "

      - name: Check notebook code compiles (syntax only, no training)
        run: |
          jupyter nbconvert --to script --stdout VGG16.ipynb > /tmp/vgg16_check.py
          python -m py_compile /tmp/vgg16_check.py
          echo "Syntax OK"
